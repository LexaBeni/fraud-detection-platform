name: CI

on:
    pull_request:
        branches: ["main"]

jobs:
    test:
        environment:
            name: testing
        runs-on: ubuntu-latest
        env:
            PYTHONPATH: ${{ github.workspace }}
            MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
            MYSQL_USER: ${{ secrets.MYSQL_USER }}
            MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
            MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
            DATABASE_URL: "mysql+pymysql://${{ secrets.MYSQL_USER }}:${{ secrets.MYSQL_PASSWORD }}@localhost:3306/${{ secrets.MYSQL_DATABASE }}"

            ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
            ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}

            TEST_DATABASE_URL: "mysql+pymysql://${{ secrets.MYSQL_USER }}:${{ secrets.MYSQL_PASSWORD }}@localhost:3306/${{ secrets.MYSQL_DATABASE }}"
            JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
            JWT_ALGORITHM: ${{ secrets.JWT_ALGORITHM }}
            ACCESS_TOKEN_EXPIRES_MINUTES: ${{ secrets.ACCESS_TOKEN_EXPIRES_MINUTES }}
            REFRESH_TOKEN_EXPIRES_DAYS: ${{ secrets.REFRESH_TOKEN_EXPIRES_DAYS }}
        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_DATABASE: ${{ env.MYSQL_DATABASE }}
                    MYSQL_USER: ${{ env.MYSQL_USER }}
                    MYSQL_PASSWORD: ${{ env.MYSQL_PASSWORD }}
                    MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
                ports:
                    - 3306:3306
                options: >-
                  --health-cmd="mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"
                  --health-interval=10s
                  --health-timeout=5s
                  --health-retries=10
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.13"
                cache: "pip"
            - name: Upgrade pip
              run: python -m pip install --upgrade pip
            - name: Install dependencies
              run: |
                pip install -r docker_requirements.txt
                pip install pytest
            - name: Run tests
              run: pytest -q
