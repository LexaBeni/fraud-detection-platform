name: CI

on:
    pull_request:
        branches: ["main"]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.13"
                cache: "pip"
            - name: Update pip
              run: python -m pip install --update pip
            - name: Install dependencies
              run: pip install docker_requirements.txt
            - name: Run tests
              run: pytest /src -q
